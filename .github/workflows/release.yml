name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Linux x64 ────────────────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install root npm dependencies
        run: npm install

      - name: Prebuild
        run: npm run prebuild-linux

      - name: Build Linux x64 (AppImage, deb, rpm)
        run: ./node_modules/.bin/electron-builder build -l --x64

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: warn

  # ─── Linux arm64 ──────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install root npm dependencies
        run: npm install

      - name: Prebuild
        run: npm run prebuild-linux

      - name: Build Linux arm64 (AppImage, deb, rpm)
        run: ./node_modules/.bin/electron-builder build -l --arm64

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: warn

  # ─── Windows x64 ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install root npm dependencies
        run: npm install

      - name: Prebuild
        run: npm run prebuild-windows

      - name: Build Windows x64 (exe, msi)
        run: node_modules\.bin\electron-builder build -w --x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn

  # ─── macOS Intel (x64) ────────────────────────────────────────────────────
  build-macos-x64:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install root npm dependencies
        run: npm install

      - name: Prebuild
        run: npm run prebuild-darwin

      - name: Build macOS Intel (pkg)
        run: ./node_modules/.bin/electron-builder build -m --x64

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.pkg
          if-no-files-found: warn

  # ─── macOS Apple Silicon (arm64) ──────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install root npm dependencies
        run: npm install

      - name: Prebuild
        run: npm run prebuild-darwin

      - name: Build macOS Apple Silicon (pkg)
        run: ./node_modules/.bin/electron-builder build -m --arm64

      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.pkg
          if-no-files-found: warn

  # ─── Publish GitHub Release ───────────────────────────────────────────────
  release:
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-windows
      - build-macos-x64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
