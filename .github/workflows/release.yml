name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release packages
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            1. **Android** — ARM64 and x64 APK
            2. **Fedora** — ARM64 and x64 RPM
            3. **macOS** — Apple Silicon ARM64 and Intel x64 PKG
            4. **Ubuntu** — ARM64 and x64 AppImage and DEB
            5. **Windows** — ARM64 and x64 EXE and MSI
          files: artifacts/*
