name: Build packaged binaries

on:
  push:
  pull_request:
  create:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Cache node modules
      uses: actions/cache@v2
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v2
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install system dependencies for x64->x32 cross-build
      run: |
        sudo apt update
        sudo apt install libc6-dev-i386 gcc-multilib g++-multilib
    - name: Setup Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 14
    - name: Setup npm
      run: sudo npm i -g npm@7
    - name: Install build deps
      run: npm install
    - name: Run prebuild script
      run: npm run prebuild-linux
    - name: Build for x64 / ia32
      run: ./node_modules/.bin/electron-builder build -l --x64 --ia32 --publish never
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-AppImages
        path: dist/*.AppImage
        if-no-files-found: error
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-deb-packages
        path: dist/*.deb
        if-no-files-found: error
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-rpm-packages
        path: dist/*.rpm
        if-no-files-found: error

  build-linux-arm32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v1
      with:
        platforms: arm
    - name: Cache node modules
      uses: actions/cache@v2
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v2
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@7 && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm32v7 (aka armv7l)
      uses: docker://arm32v7/node:14-buster
      with:
        args: bash -c "npm i -g npm@7 && npm install && ./node_modules/.bin/electron-builder build -l --armv7l --publish never"
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-arm32-AppImage
        path: dist/*.AppImage
        if-no-files-found: error
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-arm32-deb-package
        path: dist/*.deb
        if-no-files-found: error
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-arm32-rpm-package
        path: dist/*.rpm
        if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v1
      with:
        platforms: arm64
    - name: Cache node modules
      uses: actions/cache@v2
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v2
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@7 && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm64 (aka arm64v8)
      uses: docker://arm64v8/node:14-buster
      with:
        args: bash -c "npm i -g npm@7 && npm install && ./node_modules/.bin/electron-builder build -l --arm64 --publish never"
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-arm64-AppImage
        path: dist/*.AppImage
        if-no-files-found: error
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-arm64-deb-package
        path: dist/*.deb
        if-no-files-found: error
    - uses: actions/upload-artifact@v2
      with:
        name: Linux-arm64-rpm-package
        path: dist/*.rpm
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v1
    - name: Get npm cache directory
      id: npm-cache
      run: |
        echo "::set-output name=dir::$(npm config get cache)"
    - uses: actions/cache@v2
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v2
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/AppData/Local/electron/Cache
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 14
    - name: Setup npm
      run: npm i -g npm@7
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-windows -- --publish never
    - uses: actions/upload-artifact@v2
      with:
        name: Windows-Installer
        path: dist/*.msi
        if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v1
    - name: Cache node modules
      uses: actions/cache@v2
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v2
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/Library/Caches/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 14
    - name: Setup npm
      run: sudo npm i -g npm@7
    - name: npm install
      run: npm install
    - name: npm build
      run: npm run build-darwin -- --publish never
    - uses: actions/upload-artifact@v2
      with:
        name: MacOS-Image
        path: dist/*.pkg
        if-no-files-found: error

  publish-to-release:
    name: Publish binaries to GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - build-linux
      - build-linux-arm32
      - build-linux-arm64
      - build-windows
      - build-darwin
    steps:
      - name: Download Linux x64/ia32 AppImages
        uses: actions/download-artifact@v2
        with:
          name: Linux-AppImages
          path: release-assets
      - name: Download Linux x64/ia32 deb packages
        uses: actions/download-artifact@v2
        with:
          name: Linux-deb-packages
          path: release-assets
      - name: Download Linux x64/ia32 rpm packages
        uses: actions/download-artifact@v2
        with:
          name: Linux-rpm-packages
          path: release-assets
      - name: Download Linux arm32 AppImage
        uses: actions/download-artifact@v2
        with:
          name: Linux-arm32-AppImage
          path: release-assets
      - name: Download Linux arm32 deb package
        uses: actions/download-artifact@v2
        with:
          name: Linux-arm32-deb-package
          path: release-assets
      - name: Download Linux arm32 rpm package
        uses: actions/download-artifact@v2
        with:
          name: Linux-arm32-rpm-package
          path: release-assets
      - name: Download Linux arm64 AppImage
        uses: actions/download-artifact@v2
        with:
          name: Linux-arm64-AppImage
          path: release-assets
      - name: Download Linux arm64 deb package
        uses: actions/download-artifact@v2
        with:
          name: Linux-arm64-deb-package
          path: release-assets
      - name: Download Linux arm64 rpm package
        uses: actions/download-artifact@v2
        with:
          name: Linux-arm64-rpm-package
          path: release-assets
      - name: Download Windows MSI installer
        uses: actions/download-artifact@v2
        with:
          name: Windows-Installer
          path: release-assets
      - name: Download macOS pkg installers
        uses: actions/download-artifact@v2
        with:
          name: MacOS-Image
          path: release-assets
      - name: Upload all binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
